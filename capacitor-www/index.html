<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <title>REGI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        padding: 2rem;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.08em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        max-width: 22rem;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>REGI</h1>
      <p>Connecting to REGI…</p>
    </main>
  </body>
</html>
