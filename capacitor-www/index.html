<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="color-scheme" content="light dark" />
    <title>REGI</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #0f766e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        min-height: 100%;
        display: grid;
        place-content: center;
        padding: max(2rem, env(safe-area-inset-top)) 2rem
          max(2rem, env(safe-area-inset-bottom));
        text-align: center;
        box-sizing: border-box;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
        letter-spacing: 0.08em;
      }
      p {
        margin: 0.75rem 0 0;
        color: var(--muted);
        max-width: 22rem;
        line-height: 1.45;
      }
      button {
        margin-top: 1.5rem;
        appearance: none;
        border: 0;
        border-radius: 0.75rem;
        background: var(--accent);
        color: #fff;
        font: inherit;
        font-weight: 600;
        padding: 0.85rem 1.25rem;
      }
      button[hidden] {
        display: none;
      }
    </style>
    <script src="./app-config.js"></script>
  </head>
  <body>
    <main>
      <h1>REGI</h1>
      <p id="status">Connecting to REGI…</p>
      <button id="retry" type="button" hidden>Try again</button>
    </main>
    <script>
      (function () {
        var statusEl = document.getElementById("status");
        var retryEl = document.getElementById("retry");
        var serverUrl =
          (window.REGI_CAPACITOR && window.REGI_CAPACITOR.serverUrl) ||
          "https://app.regireg.com";

        function showOffline(message) {
          statusEl.textContent =
            message ||
            "You're offline. Connect to the internet to open your garage and renewals.";
          retryEl.hidden = false;
        }

        function showConnecting() {
          statusEl.textContent = "Connecting to REGI…";
          retryEl.hidden = true;
        }

        async function probe() {
          var ctrl = new AbortController();
          var timer = setTimeout(function () {
            ctrl.abort();
          }, 6000);
          try {
            var res = await fetch(serverUrl + "/api/health", {
              method: "GET",
              signal: ctrl.signal,
              cache: "no-store",
            });
            if (!res.ok) throw new Error("health " + res.status);
            return true;
          } finally {
            clearTimeout(timer);
          }
        }

        async function go() {
          showConnecting();
          if (typeof navigator !== "undefined" && navigator.onLine === false) {
            showOffline();
            return;
          }
          try {
            await probe();
            window.location.replace(serverUrl + "/");
          } catch (err) {
            showOffline(
              "REGI can't be reached right now. Check your connection and try again.",
            );
          }
        }

        retryEl.addEventListener("click", function () {
          void go();
        });
        window.addEventListener("online", function () {
          void go();
        });
        void go();
      })();
    </script>
  </body>
</html>
